# Named Cypher VIEWS for the Cypher console's Views tab. The SIMILAR_TO / HAS_RECORDING /
# HAS_MUSICAL_TASTE_SUMMARY / SUGGESTS edges are virtual — they materialize on demand when the view runs.
# (Printed scores are NOT a view/join concern: IMSLP search is a slow crawl, served by the `music`
# skill as a direct code-mode web search instead.)
# `(me:AssistantUser)` is NAMED so the scope rewriter binds it to the current user (private ratings never
# leak). Keep every virtual join in the LEADING MATCH block (a virtual join after a `WITH` is NOT
# materialized); put LIMIT/ORDER BY at the END.
#
# These are TABULAR views (they RETURN readable scalar columns, not the node), so each is terminal — run it
# to see the table. The "listen" views below materialize a YouTube recording PER candidate work (one web
# search per work, cached): quick, but prefer the cheap browse views (ChamberRecommendations /
# WorksYoullProbablyDislike) when you just want titles.

# NO `ORDER BY` WITH THE LIMIT, DELIBERATELY. HAS_RECORDING is a web search capped at 8 results per
# work with no paging, so any ranked, limited query above it is refused — INCOMPLETE_RANKING: nothing
# proves the records that were not fetched rank below the ones that were, so "the top N" would be a
# claim the fetch cannot support. The engine is right to refuse it, and it would still be right here
# even though these views only ever take ONE recording per work, which no truncation at 8 could change.
# So the bound stays and the ranking claim goes: these are N rows in the order the source returned
# them, which is true. A surface that wants them ordered can sort what it is given.

# Top works you'd like, each with ONE recording to hear.
# SIMILAR_TO (works like the ones you loved) → HAS_RECORDING (YouTube, required).
# Ranked by overlap: how many of your loved works point at each candidate.
- name: WorkRecommendations
  description: Top 5 works you'd like — each with a recording to hear.
  cypher: |
    MATCH (me:AssistantUser)-[:RATED]->(rt:MusicalWorkRating) WHERE rt.rating >= 8
    MATCH (rt)-[:SIMILAR_TO]->(w:MusicalWork)
    WHERE NOT EXISTS { (me)-[:RATED]->(seen:MusicalWorkRating) WHERE seen.workId = w.workId }
    MATCH (w)-[:HAS_RECORDING]->(r:MusicalRecording)
    WITH w, count(DISTINCT rt) AS overlap,
         head(collect(DISTINCT r)) AS rec
    RETURN w.composer AS Composer,
           w.title    AS Work,
           rec.title  AS Performance,
           rec.url    AS Recording,
           overlap    AS LovedWorksPointingHere
    LIMIT 5

# Recommendations from your taste AS A WHOLE — a two-stage chain (fan-IN MusicalTasteSummary → fan-OUT
# SUGGESTS), each pick given a recording. Same "listen" shape as WorkRecommendations, but sourced from
# your overall taste rather than similars to any one work.
- name: TasteBasedRecommendations
  description: Works matching your overall taste — each with a recording to hear.
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_MUSICAL_TASTE_SUMMARY]->(ts:MusicalTasteSummary)
    MATCH (ts)-[:SUGGESTS]->(w:MusicalWork)
    WHERE NOT EXISTS { (me)-[:RATED]->(seen:MusicalWorkRating) WHERE seen.workId = w.workId }
    MATCH (w)-[:HAS_RECORDING]->(r:MusicalRecording)
    WITH w,
         head(collect(DISTINCT r)) AS rec
    RETURN w.composer AS Composer,
           w.title    AS Work,
           w.genre    AS Genre,
           rec.title  AS Performance,
           rec.url    AS Recording
    LIMIT 8

# Cheap browse view — chamber-music picks from what you've loved, titles only (no per-work web calls).
- name: ChamberRecommendations
  description: Chamber-music picks based on what you've loved (titles only — fast).
  cypher: |
    MATCH (me:AssistantUser)-[:RATED]->(rt:MusicalWorkRating) WHERE rt.rating >= 8
    MATCH (rt)-[:SIMILAR_TO]->(w:MusicalWork)
    WHERE NOT EXISTS { (me)-[:RATED]->(seen:MusicalWorkRating) WHERE seen.workId = w.workId }
      AND w.genre CONTAINS 'Chamber'
    RETURN DISTINCT w.composer AS Composer, w.title AS Work, w.genre AS Genre
    ORDER BY Composer ASC, Work ASC

# The anti-recommendation, for fun: works like the ones you rated LOW. Titles only — no recording (you
# won't be listening) and no web calls.
- name: WorksYoullProbablyDislike
  description: Works like the ones you rated poorly — steer clear (titles only).
  cypher: |
    MATCH (me:AssistantUser)-[:RATED]->(rt:MusicalWorkRating) WHERE rt.rating <= 4
    MATCH (rt)-[:SIMILAR_TO]->(w:MusicalWork)
    WHERE NOT EXISTS { (me)-[:RATED]->(seen:MusicalWorkRating) WHERE seen.workId = w.workId }
    RETURN DISTINCT w.composer AS Composer, w.title AS Work
    ORDER BY Composer ASC, Work ASC

# Your taste in ~100 words — the fan-IN MusicalTasteSummary node, synthesized from every rating you've
# recorded. A TABULAR view so it can fall back to "No works rated" when you have no summary yet: anchor on
# the (always-present) user, OPTIONAL MATCH the virtual summary, and coalesce the empty case to a message.
- name: MyMusicTaste
  description: Your taste in classical music — or "No works rated" if you have not rated anything.
  cypher: |
    MATCH (me:AssistantUser)
    OPTIONAL MATCH (me)-[:HAS_MUSICAL_TASTE_SUMMARY]->(ts:MusicalTasteSummary)
    RETURN coalesce(ts.summary, 'No works rated') AS Taste,
           coalesce(ts.count, 0) AS RatingsUsed

# ── Multi-person taste views ────────────────────────────────────────────────────────────────
# A MusicalWorkRating carries `raterName`/`raterId` and hangs off its rater by
# `(Person)-[:RATED]->(MusicalWorkRating)` — the current user's own ratings included (their
# AssistantUser node is also a Person). So "who rated what" and "what would two people both love"
# are plain reads over the ratings; the private-type scope rewriter still confines rows to your workspace.
# (These populate once more than one person has ratings in the graph.)

# Every rating in the workspace, grouped by the person who gave it.
- name: RatingsByRater
  description: Every recorded work rating, grouped by the person who gave it, highest first.
  cypher: |
    MATCH (r:MusicalWorkRating)
    RETURN r.raterName AS Rater, r.composer AS Composer, r.title AS Work, r.rating AS Score
    ORDER BY Rater ASC, Score DESC, Work ASC

# Works TWO OR MORE people both love (rated 8+) — "what would they both enjoy at a concert".
- name: MutualFavourites
  description: Works loved (8+) by two or more people — who would enjoy hearing them together.
  cypher: |
    MATCH (r:MusicalWorkRating) WHERE r.rating >= 8
    WITH r.workId AS workId, r.composer AS composer, r.title AS title, collect(DISTINCT r.raterName) AS lovers
    WHERE size(lovers) >= 2
    RETURN composer AS Composer, title AS Work, lovers AS LovedBy, size(lovers) AS People
    ORDER BY People DESC, Composer ASC, Work ASC

# The flip side — works people most disagree on: one loves it (8+), another can't stand it (<=3).
- name: DividedOpinions
  description: Works people most disagree on — one loves it, another can't stand it.
  cypher: |
    MATCH (hi:MusicalWorkRating) WHERE hi.rating >= 8
    MATCH (lo:MusicalWorkRating) WHERE lo.rating <= 3 AND lo.workId = hi.workId AND lo.raterId <> hi.raterId
    RETURN hi.composer AS Composer, hi.title AS Work, hi.raterName AS Loves, hi.rating AS LovesScore,
           lo.raterName AS Hates, lo.rating AS HatesScore
    ORDER BY Composer ASC, Work ASC
