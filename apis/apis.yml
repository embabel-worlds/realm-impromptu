# Work metadata.
#
# Open Opus (`openopus`): free, NO auth. Two modes, and the realm needs both.
#
# SEARCH — `omnisearch` resolves a free-text "composer + work" string into a stable work id +
# title + composer + genre, so a MusicalWork canonicalizes onto the Open Opus spine (the
# classical-music analogue of OMDb's IMDb id).
#
# BROWSE — `popularComposers`, `composersByEpoch`, `composerByIds` and `worksByGenre` walk the
# catalogue by STRUCTURE. These exist because search only serves a listener who can already name
# what they want, and this realm's whole difficulty was that it had nothing to say to anyone else:
# every path began at a work the user had already rated 8 or more, so a newcomer was told to go and
# rate something first. An era, a composer, a portrait and a first work are reachable with no
# ratings, no generation and no model call at all.
#
# `composerByIds` takes a comma-separated list, which is why the composer join over a page of works
# is one request rather than one per row.
#
# RECORDING SEARCH is NOT declared here. Recordings are YouTube watch links found via
# BRAVE web search (`gateway.brave.webSearch` with `site:youtube.com/watch`), which lives
# in the RESEARCH pack as a general, reusable capability — a vendored OpenAPI spec, NOT
# MCP. (The YouTube Data API's `search.list` costs 100 quota units per call — ~100
# searches/day on the free tier — while a Brave hit's `url` IS the watch link.) This pack
# REQUIRES pack-research installed for recordings (the `recordingsByWork` producer and the
# `music` skill use that op); without it, recording lookups degrade gracefully. Set
# BRAVE_API_KEY on the assistant process.
#
# IMSLP (public-domain scores) is NOT an API and NOT a graph join: its lookup is a slow
# multi-step MediaWiki crawl, so the `music` skill searches it directly in code mode
# (brave webSearch restricted to imslp.org) when the user asks for a score.

- url: openopus-openapi.json
  name: openopus
  type: openapi
  auth: none
  operation-ids:
    - omnisearch
    - popularComposers
    - composersByEpoch
    - composerByIds
    - worksByGenre
