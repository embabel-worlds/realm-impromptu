# IMSLP scores for your top 3 rated works. Scores are deliberately NOT a graph join (IMSLP lookup is a
# slow multi-step crawl — wrong for query-time materialization), so this lens searches IMSLP DIRECTLY:
# read the top 3 rated works (instant), then ONE brave web search per work restricted to imslp.org, and
# present the work pages as links. Fast (~1s per work) and honest — a page link, not a fabricated PDF.
id: top-scores
name: Top 3 — Scores
description: IMSLP score pages for your three highest-rated works.
spec:
  kind: cypherscript
  script: |
    const top = await gateway.kg.query({
      cypher: `MATCH (me:AssistantUser)-[:RATED]->(rt:MusicalWorkRating)
               RETURN rt.title AS title, rt.composer AS composer, rt.rating AS rating
               ORDER BY rt.rating DESC, rt.title ASC LIMIT 3`,
      params: JSON.stringify({}),
    });
    const topList = (top && top.rows) ? top.rows : (top || []);
    const sections = [];
    for (const t of topList) {
      const q = [t.composer, t.title].filter(Boolean).join(' ');
      let lines = "_no IMSLP page found_";
      try {
        const res = await gateway.brave.webSearch({ q: q + " site:imslp.org", count: 5 });
        const hits = ((res.web && res.web.results) || [])
          .filter((r) => r.url && r.url.includes("imslp.org/wiki/") && !r.url.includes("Category:"));
        if (hits.length) {
          lines = hits.slice(0, 3)
            .map((r) => `- [${r.title || "IMSLP page"}](${r.url})` + (r.description ? ` — ${r.description}` : ""))
            .join("\n");
        }
      } catch (e) {
        lines = "_score search failed: " + e + "_";
      }
      sections.push(`### ${t.composer ? t.composer + " — " : ""}${t.title}  ·  your rating ${t.rating}/10\n${lines}`);
    }
    await gateway.lens.present({ content: JSON.stringify({
      kind: "text",
      title: "Scores — your top 3 works",
      markdown: sections.join("\n\n---\n\n") || "Rate some works first.",
    }) });
